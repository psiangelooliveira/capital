<div id="ao-quiz-container" style="width: 100%; display: flex; justify-content: center; align-items: center; font-family: 'Inter', sans-serif; margin: 0; padding: 0;">
    <div id="ao-quiz-widget" style="width: 100%; max-width: 360px; max-height: 450px; aspect-ratio: 4/5; background: #2E2E56; color: #FFFFFF; border-radius: 8px; position: relative; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.15);">
        
        <div class="quiz-screen" id="sc-intro" onclick="startQuiz()" style="display: block; width: 100%; height: 100%; background: url('https://psiangelooliveira.com.br/wp-content/uploads/2026/04/Quiz_1.jpg') center/cover no-repeat; cursor: pointer; position: absolute; top: 0; left: 0; z-index: 1;">
        </div>

        <div class="quiz-screen" id="sc-loading" style="display: none; width: 100%; height: 100%; background: #2E2E56; flex-direction: column; justify-content: center; align-items: center; text-align: center; position: absolute; top: 0; left: 0; z-index: 5;">
            <div style="width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.1); border-top-color: #FFFFFF; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px;"></div>
            <p style="font-size: 14px; font-weight: 600;">Calculando seu saldo...</p>
        </div>

        <div class="quiz-screen" id="sc-q" style="display: none; width: 100%; height: 100%; background: url('https://psiangelooliveira.com.br/wp-content/uploads/2026/04/telas-internas.jpg') center/cover no-repeat; position: absolute; top: 0; left: 0; z-index: 2;">
            
            <div style="position: absolute; top: 5.5%; left: 10%; width: 80%; height: 6px; background: rgba(255,255,255,0.3); border-radius: 3px;">
                <div id="q-fill" style="height: 100%; background: #FFFFFF; width: 0%; transition: width 0.4s ease; border-radius: 3px;"></div>
            </div>

            <div id="q-txt" style="position: absolute; top: 11%; left: 10%; width: 80%; height: 15%; display: flex; align-items: center; justify-content: center; text-align: center; font-size: clamp(12px, 3.5vw, 15px); font-weight: 600; padding: 0 10px; box-sizing: border-box; overflow: hidden; line-height: 1.2;"></div>

            <div id="q-opts" style="position: absolute; top: 29%; left: 10%; width: 80%; height: 38%; display: flex; flex-direction: column; gap: 8px; justify-content: flex-start; box-sizing: border-box;"></div>

            <div onclick="prevQuestion()" style="position: absolute; bottom: 2%; left: 10%; width: 25%; height: 10%; cursor: pointer; background: transparent; z-index: 10;"></div>
            <div onclick="nextQuestion()" style="position: absolute; bottom: 2%; right: 10%; width: 25%; height: 10%; cursor: pointer; background: transparent; z-index: 10;"></div>
        </div>

        <div class="quiz-screen" id="sc-r" style="display: none; width: 100%; height: 100%; background: url('https://psiangelooliveira.com.br/wp-content/uploads/2026/04/tela-final-quiz.jpg') center/cover no-repeat; position: absolute; top: 0; left: 0; z-index: 3;">
            
            <div id="r-value-box" style="position: absolute; top: 10%; left: 8%; width: 26%; height: 15%; display: flex; flex-direction: column; align-items: center; justify-content: center; box-sizing: border-box; overflow: hidden;">
                <div id="r-val-num" style="font-weight: 800; font-size: clamp(16px, 4.5vw, 21px); color: #FFFFFF; line-height: 0.9;"></div>
                <div id="r-val-unit" style="font-weight: 400; font-size: clamp(9px, 2.2vw, 11px); color: #FFFFFF; margin-top: 0px;"></div>
            </div>
            
            <div id="r-title" style="position: absolute; top: 10%; left: 38%; width: 55%; height: 15%; display: flex; align-items: center; justify-content: flex-start; font-weight: 800; font-size: clamp(16px, 4.5vw, 20px); color: #FFFFFF; line-height: 1.1; overflow: hidden; text-align: left; padding-left: 10px;"></div>
            
            <div id="r-text" style="position: absolute; top: 31%; left: 10%; width: 80%; height: 42%; display: flex; align-items: center; justify-content: center; text-align: center; font-size: clamp(12px, 3.5vw, 14px); color: #FFFFFF; line-height: 1.4; padding: 10px; box-sizing: border-box; overflow: hidden;"></div>
            
            <div onclick="window.location.href='https://psiangelooliveira.com.br/modo-aviao/'" style="position: absolute; bottom: 3%; left: 6%; width: 35%; height: 10%; cursor: pointer; background: transparent; z-index: 10;"></div>
            <div onclick="window.location.href='https://psiangelooliveira.com.br/modo-aviao/'" style="position: absolute; bottom: 3%; right: 6%; width: 35%; height: 10%; cursor: pointer; background: transparent; z-index: 10;"></div>
        </div>
    </div>
</div>

<style>
#ao-quiz-container *,
#ao-quiz-container #ao-quiz-widget * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
@keyframes spin { to { transform: rotate(360deg); } }

#ao-quiz-container .opt-btn {
    background: transparent;
    border: 1px solid #FFFFFF;
    color: #FFFFFF;
    padding: 4px 16px;
    border-radius: 4px;
    font-size: clamp(10px, 2.8vw, 12px);
    cursor: pointer;
    text-align: center;
    font-family: 'Inter', sans-serif;
    width: 100%;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    white-space: normal;
    line-height: 1.2;
    transition: all 0.2s;
    text-transform: none !important;
}

#ao-quiz-container .opt-btn.sel {
    background: rgba(255, 255, 255, 0.2);
    font-weight: 600;
    border-width: 2px;
}

/* Mobile: ocupar horizontal total */
@media (max-width: 768px) {
    #ao-quiz-widget {
        width: 100% !important;
        max-width: 100% !important;
        height: auto !important;
        max-height: none !important;
    }
}

/* Desktop: ocupar vertical total (100vh) */
@media (min-width: 769px) {
    #ao-quiz-widget {
        height: 100vh !important;
        max-height: 100vh !important;
        width: auto !important;
        max-width: none !important;
    }
}
</style>

<script>
(function() {
    const quizData = [
        {txt: "Num dia puxado, quando seu pet se aproxima, o que costuma acontecer?", opts: [{t: "Eu noto a presença, mas sigo no ritmo.", c: 1}, {t: "Faço um carinho rápido e continuo.", c: 2}, {t: "Dou uma pequena pausa sem planejar.", c: 3}, {t: "O clima do dia parece ficar mais leve.", c: 4}]},
        {txt: "Em casa, a presença do seu pet se parece mais com:", opts: [{t: "Um carinho a mais na rotina.", c: 1}, {t: "Uma companhia em momentos específicos.", c: 2}, {t: "Uma presença que quebra o automático.", c: 3}, {t: "Um vínculo que muda o dia.", c: 4}]},
        {txt: "Quando você interage com seu pet, o efeito é:", opts: [{t: "Só um momento agradável.", c: 1}, {t: "Uma mudança discreta no ritmo.", c: 2}, {t: "Um respiro breve no dia.", c: 3}, {t: "Uma pausa que faz diferença.", c: 4}]},
        {txt: "Seu pet entra na sua rotina como:", opts: [{t: "Parte do cotidiano prático.", c: 1}, {t: "Uma presença afetiva constante.", c: 2}, {t: "Um ponto de leveza.", c: 3}, {t: "Uma companhia que reorganiza.", c: 4}]},
        {txt: "Em dias de estresse, a convivência é:", opts: [{t: "Quase neutra.", c: 1}, {t: "Confortável.", c: 2}, {t: "Útil para desacelerar.", c: 3}, {t: "Uma presença que muda o tom.", c: 4}]},
        {txt: "O contato com seu pet ajuda a:", opts: [{t: "Sair um pouco da tela.", c: 1}, {t: "Lembrar que existe vida.", c: 2}, {t: "Fazer pausas reais.", c: 3}, {t: "Voltar para o presente.", c: 4}]},
        {txt: "Se pensar no clima da casa, seu pet é:", opts: [{t: "Um detalhe carinhoso.", c: 1}, {t: "Uma presença que compõe.", c: 2}, {t: "Companhia perceptível.", c: 3}, {t: "Parte importante da atmosfera.", c: 4}]},
        {txt: "Se ele passasse dias fora, sentiria falta de:", opts: [{t: "Um costume.", c: 1}, {t: "Uma presença.", c: 2}, {t: "Um ritmo que faz diferença.", c: 3}, {t: "Algo afetivo.", c: 4}]},
        {txt: "O vínculo entre vocês parece:", opts: [{t: "Um carinho simples.", c: 1}, {t: "Uma companhia que faz bem.", c: 2}, {t: "Presença que faz fluir.", c: 3}, {t: "Um laço no saldo do dia.", c: 4}]},
        {txt: "Se resumisse o papel dele hoje:", opts: [{t: "Um afeto cotidiano.", c: 1}, {t: "Companhia que alegra.", c: 2}, {t: "Presença que cria respiros.", c: 3}, {t: "Um vínculo que muda o tom.", c: 4}]}
    ];
    let currentQ = 0; let scores = [];

    window.showScreen = function(id) {
        document.querySelectorAll('.quiz-screen').forEach(s => s.style.display = 'none');
        document.getElementById(id).style.display = 'block';
    }

    window.startQuiz = function() { 
        scores = [];
        currentQ = 0;
        showScreen('sc-q'); 
        renderQuestion(); 
    }

    window.renderQuestion = function() {
        const q = quizData[currentQ];
        document.getElementById('q-txt').textContent = q.txt;
        document.getElementById('q-fill').style.width = ((currentQ + 1) / 10) * 100 + "%";
        
        const optsDiv = document.getElementById('q-opts'); 
        optsDiv.innerHTML = '';
        
        q.opts.forEach((o, i) => {
            const b = document.createElement('button'); 
            b.className = 'opt-btn'; 
            if (scores[currentQ] === o.c) b.classList.add('sel');
            b.textContent = o.t;
            b.onclick = () => { 
                scores[currentQ] = o.c; 
                document.querySelectorAll('#ao-quiz-container .opt-btn').forEach(x => x.classList.remove('sel')); 
                b.classList.add('sel'); 
            };
            optsDiv.appendChild(b);
        });
    }

    window.nextQuestion = function() {
        if (scores[currentQ] === undefined) return; 
        if (currentQ < 9) { 
            currentQ++; 
            renderQuestion(); 
        } else { 
            calcResult(); 
        }
    }

    window.prevQuestion = function() { 
        if(currentQ > 0) { 
            currentQ--; 
            renderQuestion(); 
        } 
    }

    window.calcResult = function() {
        document.querySelectorAll('.quiz-screen').forEach(s => s.style.display = 'none');
        document.getElementById('sc-loading').style.display = 'flex';
        
        const total = scores.reduce((a, b) => a + b, 0);
        setTimeout(() => {
            showScreen('sc-r');
            let valNum, valUnit, tit, txt;
            
            if(total <= 16) { 
                valNum = "R$ 35"; valUnit = "mil/ano"; 
                tit = "Viagem dos sonhos"; 
                txt = "Seu pet é uma presença carinhosa que organiza o cotidiano. É um plus de leveza, mas não substitui acompanhamento profissional se você sente sobrecarga."; 
            } else if(total <= 24) { 
                valNum = "R$ 95"; valUnit = "mil/ano"; 
                tit = "Carro novo"; 
                txt = "Seu vínculo é um ativo de conforto. Muda o clima da casa e torna a rotina respirável. É um aliado, mas não substitui suporte clínico se a rotina estiver exaustiva."; 
            } else if(total <= 32) { 
                valNum = "R$ 180"; valUnit = "mil/ano"; 
                tit = "Entrada de um imóvel"; 
                txt = "Esse vínculo é como a entrada de um projeto de vida: garante pausas e reconexão. Ajuda no fluxo, mas busque ajuda se o peso da sobrecarga ultrapassar a capacidade do seu pet de te ajudar."; 
            } else { 
                valNum = "R$ 260"; valUnit = "mil/ano"; 
                tit = "Reserva de segurança"; 
                txt = "Seu pet é uma reserva de segurança. Capital afetivo que muda o tom do dia de forma consistente. Esse suporte é valioso, mas, em momentos de alta pressão, não substitui o cuidado especializado."; 
            }
            
            document.getElementById('r-val-num').textContent = valNum;
            document.getElementById('r-val-unit').textContent = valUnit;
            document.getElementById('r-title').textContent = tit;
            document.getElementById('r-text').textContent = txt;
        }, 2000);
    }

    window.resetToHome = function() { 
        scores = []; 
        currentQ = 0; 
        showScreen('sc-intro'); 
    }
})();
</script>
